<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instructor Workbench</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <strong>Instructor Workbench</strong>
      <span>local only</span>
      <span id="build-stamp" class="build"></span>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <button id="btn-export" class="primary" title="Export everything to one Excel workbook">Export Excel</button>
  </header>

  <main>
    <section class="view" id="view-dashboard"  role="tabpanel"></section>
    <section class="view" id="view-students"   role="tabpanel"></section>
    <section class="view" id="view-courses"    role="tabpanel"></section>
    <section class="view" id="view-import"     role="tabpanel"></section>
    <section class="view" id="view-gradebook"  role="tabpanel"></section>
    <section class="view" id="view-analytics"  role="tabpanel"></section>
    <section class="view" id="view-thesis"     role="tabpanel"></section>
    <section class="view" id="view-batch"      role="tabpanel"></section>
    <section class="view" id="view-citations"  role="tabpanel"></section>
    <section class="view" id="view-integrity"  role="tabpanel"></section>
    <section class="view" id="view-compare"    role="tabpanel"></section>
    <section class="view" id="view-research"   role="tabpanel"></section>
    <section class="view" id="view-settings"   role="tabpanel"></section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
